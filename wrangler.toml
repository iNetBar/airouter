# irouter v3.4.0 — Cloudflare Pages + D1 配置
# 小白部署：把 <DATABASE_ID> 换成真实值即可（见下方「首次 3 步」）
#
# ============================================================
#  首次 3 步（只需做一次）：
#    1. npm install -g wrangler && wrangler login
#    2. wrangler d1 create irouter-db
#       → 复制输出的 id（32 位十六进制），粘贴替换下面 <DATABASE_ID>
#    3. git push（GitHub Actions 自动建表 + 部署到 Pages）
# ============================================================
#  敏感配置（不要在 wrangler.toml 里写明文！）：
#    wrangler secret put SESSION_SECRET
#    wrangler secret put DEFAULT_ADMIN_PASS
#    wrangler secret put PROXY_KEY
#    wrangler secret put API_TOKEN
#    wrangler secret put ENCRYPT_KEY

name = "irouter"

# Pages 部署目录：声明后 wrangler pages deploy 会读取本文件的
# d1_databases / vars / compatibility 等全部绑定配置（否则配置被忽略、无 D1 绑定）
# Worker 入口为 dist/_worker.js（Pages Advanced 模式自动识别），故不再定义 main
pages_build_output_dir = "dist"

compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 免费额度优化：就近调度到数据库所在 region（Free 档也支持）
[placement]
mode = "smart"

# D1 数据库绑定（替代 Deno KV）
# ⚠️ database_name 必须与 GitHub Actions 里 d1 create 的名字完全一致
[[d1_databases]]
binding = "DB"
database_name = "irouter-db"
database_id = "<DATABASE_ID>"
migrations_dir = "migrations"

# 非敏感环境变量（明文即可）
[vars]
PROJECT_NAME = "iRouter"
BASE_URL = ""

# 构建：CI 先把 dist/_worker.js 打包好（见 .github/workflows/deploy.yml），
#       Pages Advanced 模式自动以 dist/_worker.js 为入口，无需再定义 main
# 注意：wrangler 3.x 禁止同时定义 main 与 pages_build_output_dir（配置解析失败），
#       Pages 部署只要 pages_build_output_dir，Workers 部署才需要 main

# 免费额度观察：在 dashboard 看 requests / cpu 用量
[observability]
enabled = true
