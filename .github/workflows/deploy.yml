name: Deploy iRouter

# ============================================================
#  iRouter v3.3.0 小白一键部署（Cloudflare Pages + D1）
#
#  原理：GitHub Actions 全程只用官方 wrangler-action@v3，
#       绝不裸调 `wrangler` 命令 → 杜绝 "command not found" (exit 127)
#
#  流程（git push 自动触发）：
#    ① 拉代码 → ② Node 24 → ③ npm install → ④ 打包 (dist/_worker.js)
#    ⑤ 建库（wrangler d1 create，已存在容错继续）
#    ⑥ 建表（schema.sql，IF NOT EXISTS 幂等）
#    ⑦ 建 Pages 项目（已存在容错继续）+ 部署 dist → https://irouter.pages.dev
#    ⑧ 可选：Pages secrets 自动注入
#
#  首次使用只需 2 步：
#    1) 上传本仓库到 GitHub
#    2) Settings → Secrets → Actions 添加：
#         CF_API_TOKEN  (Pages:Edit + D1:Edit 权限)
#         CF_ACCOUNT_ID (Cloudflare 控制台右下角)
#
#  wrangler.toml 声明了 pages_build_output_dir = "dist"，
#  因此 pages deploy 会读取其中的 d1_databases / vars / compatibility 绑定。
#  ⚠️ Pages 不支持自定义 config 路径，Inject 步骤必须就地改 wrangler.toml；
#  ⚠️ 改完的 working tree 是 dirty 的，部署必须带 --commit-dirty=true。
# ============================================================

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 允许在 GitHub 网页手动点 "Run workflow"

# Node 20 已弃用（2025-09-19），强制走 Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Pages + D1
    steps:
      # ① 拉代码
      - name: Checkout
        uses: actions/checkout@v4

      # ② Node.js 24（明确版本，压住弃用警告）
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ③ 安装依赖（用 npm install 而非 npm ci）
      #    lock 在 Windows 上生成时只含本平台可选依赖（esbuild 的 @esbuild/win32-x64）；
      #    Linux 上 npm ci 会因缺 @esbuild/linux-x64 等报 EUSAGE，而 npm install 会按平台自动补齐
      - name: Install dependencies
        run: npm install

      # ④ 打包（必须产出 dist/_worker.js——Pages Advanced 模式自动识别为入口）
      - name: Build
        run: npm run build

      # ④b 凭据诊断（只判断存在性，不打印值；错误状态写 annotation 以便外部可见）
      #     若 EMPTY → Secrets 名字/位置配错或未填值；若 SET 但 whoami 失败 → Token 无效或权限不足
      - name: Diagnose CF credentials
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "::warning::CF_API_TOKEN  => $( [ -n "$CF_API_TOKEN" ] && echo SET || echo EMPTY )"
          echo "::warning::CF_ACCOUNT_ID => $( [ -n "$CF_ACCOUNT_ID" ] && echo SET || echo EMPTY )"
          npx wrangler whoami 2>&1 | sed -E 's/\x1B\[[0-9;]*[mK]//g' | sed 's/^/::warning::whoami => /' || echo "::warning::whoami 执行失败"

      # ⑤ 建库：d1 create（库已存在会报错，continue-on-error 容错继续）
      #    注意：wrangler-action 的 command 不经 shell 解析，绝不能写 `|| true` 这类
      #    shell 语法（会被当成 wrangler 参数导致必失败）；幂等靠下面的容错实现
      - name: Ensure D1 database exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: d1 create irouter-db
        continue-on-error: true

      # ⑤a 注入真实 D1 database_id：仓库里保持占位符 <DATABASE_ID>（无敏感信息），
      #    每次部署先从 d1 list 提取真实 uuid 写回 wrangler.toml。
      #    必须在 Apply schema / Deploy 之前执行，否则这两个 wrangler 命令会拿
      #    占位符当 UUID 请求 API → Invalid uuid [code: 7400] / Pages 8000022
      - name: Inject D1 database id
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const r=(a||[]).find(x=>x.name==='irouter-db');if(!r){console.error('D1 irouter-db not found');process.exit(1)}process.stdout.write(r.uuid||r.id)})")
          echo "D1 database_id = $DB_ID"
          sed -i "s|<DATABASE_ID>|$DB_ID|" wrangler.toml
          grep "database_id" wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # ⑤b D1 状态探测：确认 irouter-db 是否真实存在 + 远程连通性（结果写入 check annotations）
      - name: Diagnose D1 state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          STRIP="sed -E 's/\x1B\[[0-9;]*[mK]//g'"
          echo "::warning::d1 list => $(npx wrangler d1 list --json 2>&1 | sed -E 's/\x1B\[[0-9;]*[mK]//g' | tr '\n' ' ' | cut -c1-1600)"
          npx wrangler d1 execute irouter-db --remote --command="SELECT 1" 2>&1 \
            | sed -E 's/\x1B\[[0-9;]*[mK]//g' \
            | sed 's/^/::warning::probe SELECT 1 => /' || true

      # ⑥ 建表（schema.sql，IF NOT EXISTS 幂等，反复跑安全、绝不删数据）
      #    用 run: 裸命令以拿得到真实错误文本；失败时把尾部错误写进 annotation 便于排查
      - name: Apply schema (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          OUT=$(npx wrangler d1 execute irouter-db --remote --file=./schema.sql 2>&1)
          RC=$?
          CLEAN=$(printf '%s' "$OUT" | sed -E 's/\x1B\[[0-9;]*[mK]//g' | tr '\n' ' ' | cut -c1-2000)
          if [ $RC -ne 0 ]; then
            echo "::error::d1 execute rc=$RC :: $CLEAN"
            printf '%s' "$OUT" | tail -30
          else
            printf '%s' "$OUT" | tail -30
          fi
          exit $RC

      # ⑥b 验证表结构
      - name: Verify tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute irouter-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" 2>&1 \
            | sed -E 's/\x1B\[[0-9;]*[mK]//g' | sed 's/^/::warning::verify => /'
          exit ${PIPESTATUS[0]}

      # ⑦ 建 Pages 项目（已存在报错 continue-on-error 容错）+ 部署
      #    --commit-dirty=true：Inject 步骤改过 wrangler.toml，working tree 是 dirty 的
      #    --branch main：舞台为 production，发布到 pages.dev 主域
      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages project create irouter --production-branch main
        continue-on-error: true

      # ⑦b 可选：Pages secrets 自动注入（仓库里配了对应 GitHub Secrets 才生效；未配置自动跳过，可继续部署）
      #     ⚠️ 必须在 Deploy Pages 之前执行！Pages 的 secret/变量是随 deployment 构建时快照的，
      #     若在部署之后再 put，本次部署不会包含新 secret，必须再等下一次部署才生效（"设置后不生效"的经典坑）。
      - name: Set Pages secrets (optional)
        env:
          # 裸 wrangler 命令必须显式提供认证，否则 put 会因无法认证而静默失败（|| true 吞掉错误）
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DAP: ${{ secrets.DEFAULT_ADMIN_PASS }}
          SS: ${{ secrets.SESSION_SECRET }}
          PK: ${{ secrets.PROXY_KEY }}
          EK: ${{ secrets.ENCRYPT_KEY }}
        run: |
          [ -n "$DAP" ] && printf '%s' "$DAP" | npx wrangler pages secret put DEFAULT_ADMIN_PASS --project-name irouter || true
          [ -n "$SS" ] && printf '%s' "$SS" | npx wrangler pages secret put SESSION_SECRET --project-name irouter || true
          [ -n "$PK" ] && printf '%s' "$PK" | npx wrangler pages secret put PROXY_KEY --project-name irouter || true
          [ -n "$EK" ] && printf '%s' "$EK" | npx wrangler pages secret put ENCRYPT_KEY --project-name irouter || true

      # ⑦ 部署 dist → https://irouter.pages.dev
      #    --commit-dirty=true：Inject 步骤改过 wrangler.toml，working tree 是 dirty 的
      #    --branch main：舞台为 production，发布到 pages.dev 主域
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name irouter --branch main --commit-dirty=true
      - name: Done
        run: |
          echo ""
          echo "✅ 部署完成！"
          echo "   线上地址：https://irouter.pages.dev"
          echo "   管理后台：https://irouter.pages.dev/admin"
          echo "   健康检查：https://irouter.pages.dev/health"
          echo ""
          echo "⚠️ 首次务必到 Cloudflare 控制台设置密码："
          echo "   Pages → irouter → Settings → Variables and Secrets → SESSION_SECRET / DEFAULT_ADMIN_PASS"